<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GLOBIS KOREA | Print</title>

  <style>
    @page { size: A4 landscape; margin: 8mm; }
    html, body {
      margin: 0;
      padding: 0;
      background: #020617;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* print.html 자체는 iframe만 보여줌 */
    #src {
      width: 100%;
      border: 0;
      display: block;
      background: #020617;
    }

    /* PDF에서 하얀 배경/여백 방지 */
    @media print {
      html, body { background: #020617 !important; }
    }
  </style>
</head>

<body>
  <!-- 같은 폴더의 index.html을 실행(스크립트 포함)시키기 위해 iframe으로 로드 -->
  <iframe id="src" src="./index.html?__print=1"></iframe>

  <script>
    const iframe = document.getElementById("src");
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    async function waitReady(doc, timeoutMs = 30000) {
      const start = Date.now();
      while (Date.now() - start < timeoutMs) {
        // track/page가 생기면 렌더된 것으로 간주
        if (doc.querySelector("main#track, #track, .track") && doc.querySelector(".page, [data-page]")) return true;
        await sleep(200);
      }
      return false;
    }

    async function waitImages(doc, timeoutMs = 45000) {
      const start = Date.now();
      while (Date.now() - start < timeoutMs) {
        const imgs = Array.from(doc.images || []).filter(i => i.src);
        const done = imgs.filter(i => i.complete).length;
        if (imgs.length === 0 || done === imgs.length) return true;
        await sleep(250);
      }
      return false;
    }

    async function scrollAll(w, doc) {
      // 1) window 스크롤로 lazy/observer 트리거
      const total = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight);
      for (let y = 0; y < total; y += 900) {
        w.scrollTo(0, y);
        await sleep(80);
      }
      w.scrollTo(0, 0);
      await sleep(200);

      // 2) 내부 .scroll 컨테이너 스크롤로 virtual/lazy 트리거
      const scrollers = Array.from(doc.querySelectorAll(".scroll, [data-scroll], .library, .lib, .parts, .parts-list"))
        .filter(el => el.scrollHeight > el.clientHeight + 10);

      for (const el of scrollers) {
        for (let y = 0; y < el.scrollHeight; y += 800) {
          el.scrollTop = y;
          await sleep(60);
        }
        el.scrollTop = 0;
        await sleep(120);
      }
    }

    function injectPrintCSS(doc) {
      const style = doc.createElement("style");
      style.textContent = `
        @page { size: A4 landscape; margin: 8mm; }

        html, body {
          background: #020617 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          height: auto !important;
          overflow: visible !important;
        }

        /* PDF에서 불필요 UI 제거(있으면) */
        .topbar, .drawer, .modal, .toast, .fab, .floating, .bottom, .bottom-bar,
        .download, .download-btn, .download-buttons, .jump, .jumpbar, .nav, .navbar {
          display: none !important;
        }

        /* 가로 스냅/가로 스크롤 → 세로 문서 */
        main#track, #track, .track {
          height: auto !important;
          overflow: visible !important;
          display: block !important;
          scroll-snap-type: none !important;
        }

        /* 각 페이지를 종이 단위로 분리 */
        .page, [data-page] {
          width: auto !important;
          height: auto !important;
          min-height: 0 !important;
          display: block !important;
          break-after: page !important;
          page-break-after: always !important;
        }

        /* 내부 스크롤 영역은 모두 펼치기 */
        .scroll, [data-scroll], .library, .lib, .parts, .parts-list {
          max-height: none !important;
          height: auto !important;
          overflow: visible !important;
        }

        /* 중간에서 카드 잘림 방지 */
        .pcard, .card, figure, .kv, .wrap, .grid, .row, .col {
          break-inside: avoid !important;
          page-break-inside: avoid !important;
        }

        /* 애니/트랜지션이 반복 렌더 유발하는 경우 차단 */
        * { animation: none !important; transition: none !important; }
      `;
      doc.head.appendChild(style);
    }

    function forceEagerImages(doc) {
      doc.querySelectorAll("img").forEach(img => {
        try {
          img.loading = "eager";
          img.decoding = "sync";
          img.fetchPriority = "high";
        } catch (e) {}
      });
    }

    function expandIframeHeight(doc) {
      const h = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight);
      iframe.style.height = h + "px";
    }

    iframe.addEventListener("load", async () => {
      try {
        const w = iframe.contentWindow;
        const doc = iframe.contentDocument;

        // index 스크립트 렌더 대기
        await waitReady(doc, 30000);

        // 프린트 CSS 주입 + 이미지 eager
        injectPrintCSS(doc);
        forceEagerImages(doc);

        // 스크롤로 모든 항목 강제 로드
        await sleep(400);
        await scrollAll(w, doc);

        // 폰트/이미지 로딩 대기
        try { if (doc.fonts && doc.fonts.ready) await doc.fonts.ready; } catch (e) {}
        await waitImages(doc, 45000);

        // iframe 높이 확장(중요: 아래 내용 누락 방지)
        expandIframeHeight(doc);
        await sleep(200);
        expandIframeHeight(doc);

        // puppeteer에서 이 플래그를 기다리면 안정적
        window.__PRINT_READY__ = true;
      } catch (e) {
        window.__PRINT_READY__ = false;
        document.body.insertAdjacentHTML(
          "beforeend",
          `<pre style="padding:12px;color:#fff;background:#111827;white-space:pre-wrap;">PRINT ERROR: ${String(e && e.message ? e.message : e)}</pre>`
        );
      }
    });
  </script>
</body>
</html>
