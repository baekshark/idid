<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GLOBIS KOREA | Catalog Print (KR)</title>

  <!-- PDF/인쇄 전용: A4 가로 + 스크롤영역 펼치기 + 페이지 분리 -->
  <style>
    @page { size: A4 landscape; margin: 8mm; }

    /* 기본은 화면에서도 볼 수 있게 유지 */
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    /* 인쇄(PDF)에서만 강제 보정 */
    @media print {
      html, body { height: auto !important; }

      /* 상단바/하단점프/모달 등 PDF에 불필요한 UI 제거 */
      .topbar, .drawer, .modal { display: none !important; }

      /* 가로 스냅 트랙을 “세로 문서”로 변환 */
      .track {
        height: auto !important;
        display: block !important;
        overflow: visible !important;
        scroll-snap-type: none !important;
      }

      /* 각 page를 종이 한 장 단위로 분리 */
      .page {
        width: auto !important;
        height: auto !important;
        padding: 0 !important;
        display: block !important;
        break-after: page !important;
        page-break-after: always !important;
      }

      /* 내부 스크롤(.scroll) 때문에 내용/배경이 잘리거나 하얗게 되는 문제 해결 */
      .scroll {
        max-height: none !important;
        overflow: visible !important;
      }

      /* 카드 그림자(용량/깨짐 유발) 완화 */
      .card { box-shadow: none !important; }

      /* 그리드/카드가 중간에서 잘리지 않게 */
      .pcard, .kv, figure, .wrap, .card { break-inside: avoid !important; page-break-inside: avoid !important; }

      /* 인쇄에서 hover/transition이 이상 반복되며 “페이지가 아래에 복제”되는 현상 방지 */
      * { transition: none !important; animation: none !important; }
    }
  </style>

  <script>
    // index.html을 읽어서(같은 폴더) “디자인 그대로” 본문을 복제해오는 방식
    // => print.html 자체가 망가져도 index.html 기준으로 항상 동일하게 재구성됨
    (async () => {
      try {
        const res = await fetch("./index.html?__=" + Date.now(), { cache: "no-store" });
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, "text/html");

        // index.html의 모든 <style>을 그대로 복사 (디자인 동일)
        const styles = Array.from(doc.querySelectorAll("head style"));
        for (const s of styles) document.head.appendChild(s.cloneNode(true));

        // 본문: main#track(페이지들) + watermark(있는 경우)
        const track = doc.querySelector("main#track, main.track, #track");
        const watermark = doc.querySelector(".watermark");

        // body를 비우고 필요한 것만 넣기
        document.body.innerHTML = "";

        if (track) document.body.appendChild(track.cloneNode(true));
        if (watermark) document.body.appendChild(watermark.cloneNode(true));

        // 이미지/폰트 완전 로드 후 플래그 세팅 (puppeteer에서 이 플래그 기다리면 됨)
        const imgs = Array.from(document.images || []);
        await Promise.all(imgs.map(img => (img.decode ? img.decode().catch(()=>{}) : Promise.resolve())));
        if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e){} }

        window.__PRINT_READY__ = true;
      } catch (e) {
        document.body.innerHTML = "<pre style='white-space:pre-wrap;padding:16px'>PRINT BUILD ERROR: " + (e && e.message ? e.message : e) + "</pre>";
        window.__PRINT_READY__ = false;
      }
    })();
  </script>
</head>
<body></body>
</html>
