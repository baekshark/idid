<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GLOBIS KOREA | Print Catalog</title>

  <!-- PDF 기본 -->
  <style>
    @page { size: A4 landscape; margin: 8mm; }
    html, body {
      margin: 0;
      padding: 0;
      height: auto !important;
      overflow: visible !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      background: #020617 !important;
    }

    /* ✅ 핵심: index.html의 “가로 넘김/스크롤 UI”를 “세로 문서”로 강제 변환 (화면에서도 적용) */
    .topbar, .drawer, .modal { display: none !important; }

    /* track(가로 스냅) -> 세로 흐름 */
    .track, main#track, #track {
      height: auto !important;
      display: block !important;
      overflow: visible !important;
      scroll-snap-type: none !important;
      scroll-behavior: auto !important;
      -webkit-overflow-scrolling: auto !important;
    }

    /* page(한 화면) -> 페이지 단위 블록 */
    .page {
      width: auto !important;
      height: auto !important;
      min-height: 0 !important;
      flex: none !important;
      display: block !important;
      padding: 0 !important;
      break-after: page !important;
      page-break-after: always !important;
    }

    /* ✅ 핵심: “스크롤되는 카드영역”을 펼쳐서 전부 보이게 */
    .scroll {
      max-height: none !important;
      height: auto !important;
      overflow: visible !important;
    }

    /* PDF에 필요 없는 검색/필터 UI 숨김(원하면 주석 처리) */
    .libhead { display: none !important; }

    /* 카드가 중간에서 잘리지 않게 */
    .pcard, .card, .wrap, figure, .kv {
      break-inside: avoid !important;
      page-break-inside: avoid !important;
    }

    /* 애니/트랜지션 제거(반복/깜빡임 방지) */
    * { animation: none !important; transition: none !important; }
  </style>
</head>

<body>
  <div id="mount"></div>

  <script>
    (async () => {
      const mount = document.getElementById("mount");

      // 같은 폴더의 index.html을 그대로 가져와서(EN은 en/index.html, KR은 kr/index.html)
      const res = await fetch("./index.html?__=" + Date.now(), { cache: "no-store" });
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, "text/html");

      // index.html의 스타일 그대로 복사(디자인 유지)
      doc.querySelectorAll("head style").forEach(s => {
        document.head.appendChild(s.cloneNode(true));
      });

      // 본문에서 track + watermark만 복제
      const track = doc.querySelector("main#track") || doc.querySelector("#track") || doc.querySelector(".track");
      const watermark = doc.querySelector(".watermark");

      mount.innerHTML = "";
      if (track) mount.appendChild(track.cloneNode(true));
      if (watermark) mount.appendChild(watermark.cloneNode(true));

      // 이미지 강제 로드
      mount.querySelectorAll("img").forEach(img => {
        try {
          img.loading = "eager";
          img.decoding = "sync";
          img.fetchPriority = "high";
        } catch (e) {}
      });

      // 이미지/폰트 로딩 완료 대기(푸페티어가 이 상태에서 찍게)
      const imgs = Array.from(mount.querySelectorAll("img")).filter(i => i.src);
      await Promise.all(imgs.map(i => (i.decode ? i.decode().catch(()=>{}) : Promise.resolve())));
      try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch(e){}

      window.__PRINT_READY__ = true;
    })();
  </script>
</body>
</html>
