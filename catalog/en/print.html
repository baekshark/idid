<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catalog Print</title>

  <style>
    /* print.html 자체는 “빈 껍데기”로 두고, index.html을 불러와서 패치합니다 */
    html, body { margin: 0; padding: 0; background: #fff; }
    .loading { padding: 16px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
  </style>
</head>

<body>
  <div class="loading">Loading print view…</div>

  <script>
    // ✅ index.html을 그대로 불러와서, 인쇄용 패치를 추가합니다.
    fetch("index.html", { cache: "no-store" })
      .then(r => r.text())
      .then(html => {
        document.open();
        document.write(html);
        document.close();

        // ✅ 인쇄용 CSS 패치 주입
        const style = document.createElement("style");
        style.id = "PRINT_PATCH_FINAL";
        style.textContent = `
          /* ===== 기본 인쇄 설정 ===== */
          @page { size: A4 landscape; margin: 10mm; }
          @media print { * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; } }

          /* ===== (핵심) 조작 UI 숨김 ===== */
          @media print {
            button, [role="button"], .btn,
            .nav, .controls, .pager, .bottom, .bottom-nav, .dock,
            .topbar, .drawer, .watermark, .modal, .swipe-hint, .hint {
              display:none !important;
              visibility:hidden !important;
              opacity:0 !important;
            }
          }

          /* 화면에서도 미리보기 편하게(선택) */
          .topbar, .drawer, .watermark, .modal { display:none !important; }

          /* ===== (핵심) 가로 슬라이드(track) → 세로 문서로 변환 ===== */
          .track{
            display:block !important;
            width:auto !important;
            height:auto !important;
            overflow:visible !important;
            overflow-x:visible !important;
            overflow-y:visible !important;
            scroll-snap-type:none !important;
            transform:none !important;
          }

          .page{
            display:block !important;
            width:auto !important;
            height:auto !important;
            min-height:auto !important;
            overflow:visible !important;
            flex:none !important;
            transform:none !important;

            /* 페이지 단위 구분 (원하면 always, 싫으면 auto로) */
            page-break-after: always;
            break-after: page;
          }

          /* ===== (핵심) 내부 스크롤(scroll) “완전 펼치기” ===== */
          .scroll, .scroller, .overflow, .overflow-y, .overflowY,
          [style*="overflow"], [style*="max-height"], [style*="height"]{
            overflow:visible !important;
            overflow-y:visible !important;
            max-height:none !important;
            height:auto !important;
          }

          /* ===== 카드/타일 잘림 방지(가능한 만큼) ===== */
          .card, img, figure, .tile, .item{
            break-inside: avoid;
            page-break-inside: avoid;
          }

          /* ===== 인쇄 시 레이아웃 흔들림 방지 ===== */
          *{ animation:none !important; transition:none !important; }
        `;
        document.head.appendChild(style);

        // ✅ beforeprint 때 한 번 더 “스크롤 박스” 강제 해제(안 먹는 케이스 방지)
        window.addEventListener("beforeprint", () => {
          const els = Array.from(document.querySelectorAll("*"));
          for (const el of els) {
            const st = getComputedStyle(el);
            if ((st.overflowY === "auto" || st.overflowY === "scroll") && el.scrollHeight > el.clientHeight + 50) {
              el.style.overflow = "visible";
              el.style.overflowY = "visible";
              el.style.maxHeight = "none";
              el.style.height = "auto";
            }
          }
        });

        // ✅ 로딩 문구 제거
        const loading = document.querySelector(".loading");
        if (loading) loading.remove();
      })
      .catch(err => {
        document.body.innerHTML = "<pre style='padding:16px'>Failed to load index.html\\n" + err + "</pre>";
      });
  </script>
</body>
</html>
