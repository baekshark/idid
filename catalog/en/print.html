<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GLOBIS KOREA | E-Catalog (EN) • PRINT/PDF</title>

  <!--
    print.html (PDF용)
    - 같은 폴더의 index.html을 그대로 불러와(스타일/본문/스크립트 포함) PDF 프린트에 맞게 레이아웃만 "세로 나열"로 바꿉니다.
    - 웹용 E-카달로그(index.html)는 건드리지 않습니다.
  -->

  <style>
    .printbar {
      position: sticky;
      top: 0;
      z-index: 9999;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      padding: 10px 12px;
      background: rgba(0,0,0,.78);
      color: #fff;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      border-bottom: 1px solid rgba(255,255,255,.15);
      backdrop-filter: blur(10px);
    }
    .printbar .left { font-weight: 800; letter-spacing: .2px; }
    .printbar .right { font-size: 12px; opacity: .85; }
    .printbar code {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.16);
      padding: 2px 6px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    :root { color-scheme: dark; }

    .track {
      height: auto !important;
      display: block !important;
      overflow: visible !important;
      scroll-snap-type: none !important;
    }
    .page {
      width: auto !important;
      height: auto !important;
      flex: none !important;
      scroll-snap-align: unset !important;
      padding: 24px 18px 24px !important;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .scroll {
      max-height: none !important;
      overflow: visible !important;
    }

    .topbar, .drawer, .watermark, .modal {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      height: 0 !important;
    }

    .libhead { display:none !important; }

    .pcard:hover { transform:none !important; }

    @page {
      size: A4 landscape;
      margin: 8mm;
    }
    @media print {
      .printbar { display:none !important; }
      a { text-decoration: none !important; color: inherit !important; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <div class="printbar">
    <div class="left">GLOBIS E‑Catalog (EN) • PRINT/PDF</div>
    <div class="right">
      <span>PDF 저장: <code>Ctrl</code> + <code>P</code> → 대상: <b>PDF로 저장</b> → <b>가로</b> → <b>배경 그래픽</b> 켜기</span>
    </div>
  </div>

  <div id="mount" aria-busy="true" style="padding:18px; color:#cbd5ff; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;">
    Loading catalog… (index.html을 불러오는 중)
  </div>

  <script>
    async function loadIndexHtml() {
      const res = await fetch('./index.html?cb=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('Failed to load index.html: ' + res.status);
      const htmlText = await res.text();
      const doc = new DOMParser().parseFromString(htmlText, 'text/html');

      const styles = Array.from(doc.querySelectorAll('style'));
      styles.forEach(st => {
        const s = document.createElement('style');
        s.textContent = st.textContent;
        document.head.appendChild(s);
      });

      const main = doc.querySelector('main.track');
      if (!main) throw new Error('index.html에서 <main class="track">를 찾지 못했습니다.');
      const mount = document.getElementById('mount');
      mount.replaceWith(main);

      const scripts = Array.from(doc.querySelectorAll('script'));
      for (const old of scripts) {
        const s = document.createElement('script');
        if (old.src) s.src = old.src;
        else s.textContent = old.textContent;
        document.body.appendChild(s);
      }

      setTimeout(() => {
        try {
          if (typeof window.setCat === 'function') window.setCat('ALL');
          const q = document.getElementById('q');
          if (q) {
            q.value = '';
            q.dispatchEvent(new Event('input', { bubbles: true }));
          }
        } catch (e) {}
      }, 50);
    }

    loadIndexHtml().catch(err => {
      const mount = document.getElementById('mount');
      mount.innerHTML = '<b style="color:#ffb4b4">ERROR:</b> ' + (err && err.message ? err.message : err);
      console.error(err);
    });
  </script>
</body>
</html>
