<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>(주)글로비스코리아 Virtual Showroom</title>
  <link rel="stylesheet" href="style_rebuilt.css" />
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-card">
        <div>
          <div class="eyebrow">(주)글로비스코리아</div>
          <h1>Virtual Showroom</h1>
          <p>배경 이미지는 그대로 유지하고, 제품은 코드로 렌더링되도록 다시 구성했습니다.</p>
        </div>
      </div>

      <section class="panel">
        <h2>1. Space Type</h2>
        <div class="segmented" id="categoryButtons">
          <button type="button" data-category="residential" class="seg-btn active">Residential</button>
          <button type="button" data-category="office" class="seg-btn">Office</button>
        </div>
      </section>

      <section class="panel">
        <h2>2. Space</h2>
        <div id="roomTabs" class="room-tabs"></div>
      </section>

      <section class="panel">
        <h2>3. Product</h2>
        <div id="productButtons" class="chip-grid"></div>
      </section>

      <section class="panel" id="curtainTypePanel" hidden>
        <h2>4. Curtain Type</h2>
        <div id="subTypeButtons" class="chip-grid"></div>
      </section>

      <section class="panel">
        <h2>* Color</h2>
        <div id="colorButtons" class="chip-grid chip-grid--colors"></div>
      </section>

      <!--       
      <section class="panel">
        <h2>6. State</h2>
        <div class="segmented segmented--state" id="stateButtons">
          <button type="button" class="seg-btn active" data-state="closed">Closed</button>
          <button type="button" class="seg-btn" data-state="half">Half</button>
          <button type="button" class="seg-btn" data-state="open">Open</button>
        </div>
      </section>
      -->

      <section class="panel action-panel">
        <button id="applyBtn" class="primary-btn" type="button">현재 방 전체 창에 적용</button>
        <button id="clearSelectedBtn" class="ghost-btn" type="button">Clear Selected Window</button>
        <button id="clearRoomBtn" class="ghost-btn danger" type="button">Clear Room</button>
      </section>

      <section class="panel">
        <h2 id="selectionTitle">Living Room Window</h2>
        <div id="statusBox" class="status-box">창 영역을 먼저 선택해 주세요.</div>
      </section>


    </aside>

    <main class="viewer-wrap">
      <section class="viewer-card">
        <div class="viewer-header">
          <div class="viewer-header-left">
            <div id="viewerRoomName" class="viewer-room-name">Living Room</div>
            <div class="viewer-guide">창 선택 영역을 클릭한 후 제품을 적용하세요.</div>
          </div>

          <div class="viewer-header-right">
            <div class="segmented segmented--state" id="stateButtons">
              <button type="button" class="seg-btn active" data-state="closed">Closed</button>
              <button type="button" class="seg-btn" data-state="half">Half</button>
              <button type="button" class="seg-btn" data-state="open">Open</button>
            </div>
          </div>
        </div>

        <div id="scene" class="scene">
          <img id="roomImage" src="images/living-room.jpg" alt="Showroom Space" />
          <div id="productLayer" class="product-layer"></div>
          <div id="areaLayer" class="area-layer"></div>
          <div class="watermark">GLOBIS Korea Corp. Virtual Showroom</div>
        </div>
      </section>
    </main>
  </div>

  <script src="script_rebuilt.js"></script>
</body>

</html>
